[package]
name = "wingox-cli"
description = "Wingox headless test harness: connect to RouterOS (optionally via a proxy)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wingox"
path = "src/main.rs"

[dependencies]
wingox-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"

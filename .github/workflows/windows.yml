# Builds the Wingox Windows app on a push to main that touches the app (and on
# demand), so a change can be checked by downloading the .exe from the run's
# artifacts. Windows binaries must be built on Windows (WebView2 + MSVC).
#
# Not built: pushes that only touch docs/notes/dev scripts (paths-ignore), and
# any push whose commit message contains [skip ci]. A newer push cancels a build
# still running for an older one. Releases are built by release.yml from tags.
name: Windows build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "dev/**"
      - ".github/release-notes/**"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build the Tauri app
        run: npm run tauri build

      - name: Upload Windows installers and exe
        uses: actions/upload-artifact@v4
        with:
          name: wingox-windows
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/wingox.exe

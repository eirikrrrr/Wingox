# Builds the Wingox Windows app on every push to main (and on demand), so a
# visual change can be checked by downloading the .exe from the run's artifacts.
# Windows binaries must be built on Windows (WebView2 + MSVC), hence the runner.
name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build the Tauri app
        run: npm run tauri build

      - name: Upload Windows installers and exe
        uses: actions/upload-artifact@v4
        with:
          name: wingox-windows
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/wingox.exe

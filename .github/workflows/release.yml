# Publishes a GitHub release when a version tag is pushed (git tag v0.1.0-alpha.1
# && git push origin v0.1.0-alpha.1): builds the Windows app and attaches the
# installers, a portable exe and their SHA-256 sums. Nothing is published if the
# build fails or the tag does not match the app's version.
#
# Channels: a tag with a suffix (v0.2.0-alpha.3, -beta.1, -rc.1) is published as
# a GitHub *pre-release* titled with its channel; a plain vX.Y.Z is a stable
# release. The MSI cannot carry a text suffix, so src-tauri/tauri.conf.json sets
# bundle.windows.wix.version to X.Y.Z.N (N = the pre-release number).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but src-tauri/tauri.conf.json says $app"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build the Tauri app
        run: npm run tauri build

      - name: Collect the release files
        shell: pwsh
        run: |
          $v = "$env:GITHUB_REF_NAME".TrimStart("v")
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release/
          Copy-Item src-tauri/target/release/wingox.exe "release/wingox-$v-windows-x64-portable.exe"
          Get-ChildItem release -File |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-ChildItem release

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          channel=$(echo "$GITHUB_REF_NAME" | sed -nE 's/^v[0-9.]+-(alpha|beta|rc).*/\1/p')
          if [ -n "$channel" ]; then
            gh release create "$GITHUB_REF_NAME" release/* --prerelease \
              --title "Wingox $GITHUB_REF_NAME ($channel)" "${args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" release/* --latest --title "Wingox $GITHUB_REF_NAME" "${args[@]}"
          fi
